<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Media Guide Daily</title>
  <meta name="description" content="Medya planlama ve satın alma için günlük Türkiye ve global medya bülteni.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3EMG%3C/text%3E%3C/svg%3E">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">
        <span class="brand-mark">MG</span>
        <span class="brand-text">
          <strong>Media Guide Daily</strong>
          <small>Medya planlama ve satın alma bülteni</small>
        </span>
      </a>
      <div class="topbar-actions">
        <button class="btn ghost" id="archiveToggle" type="button" aria-expanded="false">Arşiv</button>
        <button class="btn ghost" id="shareBtn" type="button">Linki kopyala</button>
        <button class="btn ghost icon" id="themeBtn" type="button" aria-label="Tema değiştir"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
      </div>
    </div>
  </header>

  <div class="layout">
    <aside class="archive" id="archive" aria-label="Bülten arşivi">
      <h2 class="archive-title">Arşiv</h2>
      <ul id="archiveList" class="archive-list"></ul>
    </aside>

    <main id="main" class="content">
      <p class="loading">Bülten yükleniyor…</p>
    </main>
  </div>

  <footer class="footer">
    <p>Kamuya açık kaynaklardan derlenen özetlerdir. Her haberde kaynak, yayın ve olay tarihi ayrı verilir; tahminler ölçülmüş sonuç olarak sunulmaz.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js"></script>
</body>
</html>
